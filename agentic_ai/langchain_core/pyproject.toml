[project]
name = "langchain_core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sanaullah", email = "sanaullah@github.con" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-google-vertexai>=3.2.4",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.6",
    "langchain-openrouter>=0.2.9",
    "python-dotenv>=1.2.3",
]

[project.scripts]
langchain_core = "langchain_core:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
