[project]
name = "deep_agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sanaullah", email = "sanaullah@github.con" }
]
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.22",
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "langchain-openrouter>=0.2.9",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
deep_agents = "deep_agents:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
